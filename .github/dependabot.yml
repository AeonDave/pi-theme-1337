version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      pi-host:
        patterns:
          - "@earendil-works/pi-*"
    ignore:
      # Node types track the oldest supported Node major (engines.node >=22.19.0).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
